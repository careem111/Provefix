# Mock-only: a deliberately bad "fix" that the anti-cheat diff must reject.
# It blocks the attack by deleting the db Deployment and denying all traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-data
data:
  health.txt: "ok\n"
  secret.txt: "customer-records: alice,bob,carol\n"
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
